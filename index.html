<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BONES GAME STORE</title>
<style>
:root{--bg:#0b0b12;--panel:#141420;--panel2:#1b1b2a;--line:#2b2b40;--text:#f4f2ff;--muted:#a5a2b8;--purple:#8b5cf6;--purple2:#6d3be5;--green:#35d49a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{height:auto;min-height:72px;padding:14px 22px;background:#11111b;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5}
.logo{font-size:20px;font-weight:900;letter-spacing:1px;white-space:nowrap}.logo span{color:#a78bfa}
.search{flex:1;max-width:650px;margin:auto}.search input{width:100%;background:#202031;border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:white;outline:none}
.profile-btn,.primary,.secondary,.nav-btn,.game,.category,.listing{border:1px solid var(--line);border-radius:12px}
.profile-btn{background:#202031;color:white;padding:11px 15px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1450px;margin:auto;min-height:calc(100vh - 72px)}
.sidebar{padding:22px 14px;border-right:1px solid var(--line);background:#101019}
.nav-btn{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;background:transparent;color:var(--muted)}
.nav-btn:hover,.nav-btn.active{background:#28213e;color:white;border-color:#59408d}
main{padding:28px;min-width:0}
.hero{padding:28px;border-radius:18px;background:linear-gradient(120deg,#251943,#17172a 70%);border:1px solid #49366e;margin-bottom:22px}
.hero h1{font-size:30px;margin:0 0 9px}.hero p{color:#c7bddf;margin:0;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}
.stat{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat strong{display:block;font-size:22px;margin-bottom:5px}.muted{color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 15px}.section-head h2{font-size:21px;margin:0}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}
.game{background:var(--panel);padding:16px 12px;text-align:center;transition:.18s;cursor:pointer;min-width:0}
.game:hover,.category:hover,.listing:hover{transform:translateY(-2px);border-color:#7651bd}
.game-image{width:82px;height:82px;object-fit:cover;border-radius:18px;margin:0 auto 12px;display:block;background:#242438;border:1px solid #343449}
.game strong{display:block;font-size:14px;min-height:32px;overflow-wrap:anywhere}.game p{font-size:12px;color:var(--muted);margin:8px 0 0}
.emoji{width:82px;height:82px;border-radius:18px;background:#242438;display:grid;place-items:center;font-size:38px;margin:0 auto 12px}
.back{background:transparent;color:#c4b5fd;border:0;padding:0;margin-bottom:18px}
.categories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}
.category{background:var(--panel);color:white;text-align:left;padding:18px;display:flex;align-items:center;gap:12px}
.category .ico{font-size:25px}.category strong{font-size:14px}
.listings{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.listing{background:var(--panel);padding:16px}.listing h3{margin:0 0 8px;font-size:16px}.listing p{color:var(--muted);font-size:13px;line-height:1.5}.price{font-size:19px;font-weight:bold;color:#c4b5fd;margin:12px 0}
.primary{background:var(--purple2);color:white;border:0;padding:12px 16px}.primary:hover{background:var(--purple)}
.secondary{background:#252538;color:white;padding:11px 15px}
.form-card{max-width:680px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.field{margin:0 0 15px}.field label{display:block;font-size:13px;color:#c7c3d8;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:10px;background:#202031;color:white;border:1px solid var(--line);outline:none}
.field textarea{min-height:95px;resize:vertical}
.notice{padding:13px 15px;background:#211d32;border:1px solid #45366a;border-radius:12px;color:#cfc4ec;font-size:13px;line-height:1.5;margin-bottom:16px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:14px}
.hidden{display:none!important}
footer{color:#77748a;font-size:12px;padding:30px 0 10px}
@media(max-width:760px){.topbar{flex-wrap:wrap}.logo{font-size:17px}.search{order:3;flex-basis:100%;max-width:none}.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow-x:auto;gap:7px;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.nav-btn{white-space:nowrap;width:auto;margin:0;padding:10px 12px}main{padding:18px}.stats{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">BONES <span>GAME STORE</span></div>
  <div class="search"><input id="searchInput" type="search" placeholder="Поиск игр и товаров..." oninput="searchAll(this.value)"></div>
  <button class="profile-btn" onclick="showPage('settings')">Профиль</button>
</header>
<div class="layout">
  <aside class="sidebar">
    <button class="nav-btn active" data-page="home" onclick="showPage('home')">⌂ Главная</button>
    <button class="nav-btn" data-page="catalog" onclick="showPage('catalog')">▦ Каталог</button>
    <button class="nav-btn" data-page="purchases" onclick="showPage('purchases')">▣ Мои покупки</button>
    <button class="nav-btn" data-page="sell" onclick="showPage('sell')">＋ Продать товар</button>
    <button class="nav-btn" data-page="messages" onclick="showPage('messages')">✉ Сообщения</button>
    <button class="nav-btn" data-page="settings" onclick="showPage('settings')">⚙ Настройки</button>
  </aside>
  <main id="app"></main>
</div>
<script>
const games=[
["PUBG Mobile","images/pubg.png","🔫"],
["Brawl Stars","images/brawl-stars.png","⭐"],
["Clash of Clans","images/clash-of-clans.jpg","🏰"],
["Free Fire","images/free-fire.png","🔥"],
["Roblox","images/roblox.png","🧱"],
["Minecraft","images/minecraft.png","⛏️"],
["Mobile Legends","images/mobile-legends.png","⚔️"],
["Clash Royale","images/clash-royale.png","👑"],
["Standoff 2","images/standoff-2.png","🎯"],
["Genshin Impact","images/genshin-impact.png","✨"],
["Fortnite","images/fortnite.png","🪂"],
["Dota 2","images/dota-2.png","🛡️"],
["Counter-Strike 2","images/cs2.png","💣"],
["Valorant","images/valorant.png","🎯"],
["League of Legends","images/league-of-legends.png","🐉"],
["World of Tanks","images/world-of-tanks.png","🚜"],
["Call of Duty","images/call-of-duty.png","🎖️"],
["GTA V","images/gta-5.png","🚗"],
["Steam","images/steam.png","🎮"],
["Apex Legends","images/apex-legends.png","🚀"],
["War Thunder","images/war-thunder.png","✈️"],
["EA Sports FC","images/ea-sports-fc.png","⚽"],
["Among Us","images/among-us.png","👾"],
["Terraria","images/terraria.png","🌳"],
["TikTok","images/tiktok.png","🎵"],
["Instagram","images/instagram.png","📸"],
["YouTube","images/youtube.png","▶️"],
["ChatGPT","images/chatgpt.png","🤖"],
["Car Parking Multiplayer","images/car-parking.png","🚘"],
["Mortal Kombat Mobile","images/mortal-kombat.png","🥷"],
["Shadow Fight","images/shadow-fight.png","⚔️"],
["Discord","images/discord.png","💬"],
["Telegram","images/telegram.png","✈️"],
["Матрёшка RP","images/matreshka-rp.png","🚔"],
["Abyss of Dungeons","images/abyss-of-dungeons.png","🏰"],
["Amazing RP","images/amazing-rp.png","🌆"],
["App Store","images/app-store.png","🍎"],
["Arena Breakout","images/arena-breakout.png","🔫"],
["ARK: Survival Evolved","images/ark.png","🦖"],
["Back 4 Blood","images/back-4-blood.png","🧟"]
];
const pubgCategories=[
["Аккаунты","👤"],["UC","💎"],["Донат","💳"],["WOW Coins","🪙"],
["Брейнроты","🧠"],["Буст","🚀"],["Достижения","🏆"],["Metro Royale","🎒"],
["Популярность","❤️"],["Карточки","🃏"],["Прочее","📦"]
];
let currentGame="";let currentCategory="";let listings=[];
let username=localStorage.getItem("bonesUsername")||"Игрок";
function imageMarkup(g){
 const safeName=escapeHTML(g[0]);
 const safePath=escapeHTML(g[1]);
 const safeEmoji=escapeHTML(g[2]);
 return `<img src="${safePath}" class="game-image" alt="${safeName}"
 data-fallbacks="1"
 onerror="tryNextImage(this, '${safePath}', '${safeEmoji}')">`;
}
function tryNextImage(img, originalPath, emoji){
 const extensions=["png","jpg","jpeg","webp"];
 const folder=originalPath.includes("/")?originalPath.slice(0,originalPath.lastIndexOf("/")+1):"";
 const filename=originalPath.slice(originalPath.lastIndexOf("/")+1);
 const base=filename.replace(/\\.[^.]+$/,"");
 let attempt=Number(img.dataset.fallbacks||"1");
 if(attempt<extensions.length){
   img.dataset.fallbacks=String(attempt+1);
   img.src=folder+base+"."+extensions[attempt];
   return;
 }
 const fallback=document.createElement("div");
 fallback.className="emoji";
 fallback.textContent=emoji;
 img.replaceWith(fallback);
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderGames(list){return `<div class="games-grid">${list.map((g)=>`<div class="game" onclick="selectGame('${escapeHTML(g[0])}')">${imageMarkup(g)}<strong>${escapeHTML(g[0])}</strong><p>Смотреть товары →</p></div>`).join("")}</div>`;}
function showPage(page){
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 const app=document.getElementById("app");
 if(page==="home"){app.innerHTML=`<section class="hero"><h1>Добро пожаловать в BONES GAME STORE</h1><p>Игровые товары, аккаунты и услуги в одном месте. Выбирай игру и изучай объявления.</p></section><div class="stats"><div class="stat"><strong>40</strong><span class="muted">Игр в каталоге</span></div><div class="stat"><strong>${listings.length}</strong><span class="muted">Демо-объявлений в этой сессии</span></div><div class="stat"><strong>${escapeHTML(username)}</strong><span class="muted">Твой профиль</span></div></div><div class="section-head"><h2>Популярные игры</h2><button class="secondary" onclick="showPage('catalog')">Весь каталог</button></div>${renderGames(games.slice(0,8))}`;}
 else if(page==="catalog"){app.innerHTML=`<div class="section-head"><h2>Каталог игр</h2><span class="muted">${games.length} игр</span></div>${renderGames(games)}`;}
 else if(page==="sell"){app.innerHTML=sellForm();}
 else if(page==="purchases"){app.innerHTML=`<h2>Мои покупки</h2><div class="empty">Пока здесь ничего нет. История покупок появится после подключения настоящей системы заказов.</div>`;}
 else if(page==="messages"){app.innerHTML=`<h2>Сообщения</h2><div class="empty">Чат пока не подключён. Для настоящих сообщений потребуется сервер и база данных.</div>`;}
 else if(page==="settings"){app.innerHTML=`<h2>Настройки профиля</h2><div class="form-card"><div class="field"><label>Имя пользователя</label><input id="usernameInput" maxlength="24" value="${escapeHTML(username)}"></div><button class="primary" onclick="saveUsername()">Сохранить имя</button></div>`;}
}
function selectGame(name){
 currentGame=name;
 if(name==="PUBG Mobile"){showPubgCategories();return;}
 showGameListings(name,"");
}
function showPubgCategories(){
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page==="catalog"));
 document.getElementById("app").innerHTML=`<button class="back" onclick="showPage('catalog')">← Назад к каталогу</button><div class="section-head"><h2>PUBG Mobile — категории</h2></div><div class="categories-grid">${pubgCategories.map(c=>`<button class="category" onclick="showGameListings('PUBG Mobile','${c[0]}')"><span class="ico">${c[1]}</span><strong>${c[0]}</strong></button>`).join("")}</div>`;
}
function showGameListings(game,category){
 currentGame=game;currentCategory=category;
 const found=listings.filter(x=>x.game===game&&(!category||x.category===category));
 document.getElementById("app").innerHTML=`<button class="back" onclick="${game==="PUBG Mobile"?"showPubgCategories()":"showPage('catalog')"}">← Назад</button><div class="section-head"><h2>${escapeHTML(game)}${category?" — "+escapeHTML(category):""}</h2><button class="primary" onclick="openSellFor('${escapeHTML(game)}','${escapeHTML(category)}')">＋ Разместить товар</button></div>${found.length?`<div class="listings">${found.map(x=>`<article class="listing"><h3>${escapeHTML(x.title)}</h3><p>${escapeHTML(x.description||"Описание не указано")}</p><div class="muted">${escapeHTML(x.game)}${x.category?" · "+escapeHTML(x.category):""}</div><div class="price">${escapeHTML(x.price)} ₽</div><button class="secondary" onclick="alert('Это демонстрационное объявление. Покупка пока не подключена.')">Подробнее</button></article>`).join("")}</div>`:`<div class="empty">Пока нет объявлений в этой категории.<br><br><button class="primary" onclick="openSellFor('${escapeHTML(game)}','${escapeHTML(category)}')">Разместить первое объявление</button></div>`}`;
}
function sellForm(){return `<h2>Продать товар</h2><div class="notice">Это демонстрационная форма: объявление появится на сайте, но пока хранится только в памяти страницы и исчезнет после перезагрузки.</div><div class="form-card"><div class="field"><label>Игра</label><select id="sellGame" onchange="updateSellCategories()">${games.map(g=>`<option>${escapeHTML(g[0])}</option>`).join("")}</select></div><div class="field" id="categoryField"><label>Категория PUBG Mobile</label><select id="sellCategory">${pubgCategories.map(c=>`<option>${c[0]}</option>`).join("")}</select></div><div class="field"><label>Название товара</label><input id="sellTitle" maxlength="70" placeholder="Например: аккаунт с редкими предметами"></div><div class="field"><label>Описание</label><textarea id="sellDescription" maxlength="500" placeholder="Расскажи о товаре..."></textarea></div><div class="field"><label>Цена (руб.)</label><input id="sellPrice" type="number" min="1" placeholder="Например: 500"></div><button class="primary" onclick="publishListing()">Опубликовать объявление</button></div>`;}
function updateSellCategories(){document.getElementById("categoryField").classList.toggle("hidden",document.getElementById("sellGame").value!=="PUBG Mobile");}
function openSellFor(game,category){showPage("sell");document.getElementById("sellGame").value=game;updateSellCategories();if(game==="PUBG Mobile"&&category)document.getElementById("sellCategory").value=category;}
function publishListing(){
 const game=document.getElementById("sellGame").value,title=document.getElementById("sellTitle").value.trim(),description=document.getElementById("sellDescription").value.trim(),price=Number(document.getElementById("sellPrice").value);
 if(!title||!price||price<1){alert("Заполни название и укажи корректную цену.");return;}
 const category=game==="PUBG Mobile"?document.getElementById("sellCategory").value:"";
 listings.push({game,category,title,description,price:String(price)});
 alert("Демо-объявление добавлено!");
 showGameListings(game,category);
}
function saveUsername(){const v=document.getElementById("usernameInput").value.trim();if(!v){alert("Введи имя.");return;}username=v;localStorage.setItem("bonesUsername",username);alert("Имя сохранено.");showPage("settings");}
function searchAll(q){
 const value=q.trim().toLowerCase();
 if(!value){showPage("catalog");return;}
 const matches=games.filter(g=>g[0].toLowerCase().includes(value));
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page==="catalog"));
 document.getElementById("app").innerHTML=`<div class="section-head"><h2>Результаты поиска</h2><span class="muted">${matches.length}</span></div>${matches.length?renderGames(matches):`<div class="empty">Ничего не найдено.</div>`}`;
}
showPage("home");
</script>
</body>
</html>
